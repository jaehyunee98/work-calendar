<style>
  @font-face{font-family:'ChangwonDangamRounded';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-1@1.0/ChangwonDangamRound-Regular.woff2') format('woff2');font-weight:normal;font-display:swap;}
  @font-face{font-family:'Cafe24ProSlim';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-1@1.0/Cafe24PROSlim-Light.woff2') format('woff2');font-weight:300;font-display:swap;}
  @font-face{font-family:'Cafe24ProSlim';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-1@1.0/Cafe24PROSlim-Regular.woff2') format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'Cafe24ProSlim';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-1@1.0/Cafe24PROSlim-Bold.woff2') format('woff2');font-weight:700;font-display:swap;}
  :root{
    --font-title:'ChangwonDangamRounded','Cafe24ProSlim',sans-serif;
    --font-body:'Cafe24ProSlim','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --brown-900:#231106;
    --brown-800:#3B2110;
    --brown-700:#4A2B17;
    --brown-600:#6B4226;
    --brown-500:#8C6142;
    --cream:#FBF6EF;
    --cream-dim:#EEDFC7;
    --cell-bg:#F9F1E3;
    --blue-200:#DCEEF2;
    --blue-300:#C5E0E6;
    --blue-400:#A9CFD8;
    --blue-500:#7FB3C0;
    --ink-cream:#F6ECDF;
    --ink-dark:#2E1F16;
    --muted-brown:#C7AE97;
    --muted-cream:#8C7A6B;
    --line-brown:rgba(246,236,223,0.14);
    --line-cream:#DCC9A9;
    --leave:#D9973F;
    --leave-tint:#F4E2C6;
    --ship:#3E6E78;
    --ship-tint:#D8E9EC;
    --pay:#8A7A2E;
    --pay-tint:#EDE7C6;
    --sun:#D07A5E;
    --sat:#7FB3C0;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow:0 10px 26px rgba(15,7,3,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--brown-900);
    color:var(--ink-cream);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 16px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 0 16px;
  }
  .brand{font-family:var(--font-title);}
  .brand .b1{font-size:23px;font-weight:700;color:var(--ink-cream);}
  .brand .b2{font-size:23px;font-weight:400;color:var(--blue-300);margin-left:2px;}
  .brand .sub{display:block;font-size:11px;color:var(--muted-brown);margin-top:3px;letter-spacing:.02em;}
  .iconbtn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line-brown);
    background:var(--brown-700);display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--blue-300);flex:none;
  }
  .iconbtn:active{transform:scale(0.94);}
  .iconbtn svg{width:18px;height:18px;}

  /* ---------- Stat panel (signature element) ---------- */
  .stat-panel{
    position:relative;
    border-radius:var(--radius-lg);
    background:var(--blue-300);
    padding:24px 16px 20px;
    margin-bottom:22px;
    box-shadow:var(--shadow);
  }
  .stat-row{display:flex;justify-content:center;gap:20px;}
  .stat-item{display:flex;flex-direction:column;align-items:center;flex:1;max-width:180px;min-width:0;}
  .stat-item.clickable{cursor:pointer;}
  .stat-item.clickable:active{transform:scale(0.97);}
  .stat-ring{
    width:92px;height:92px;border-radius:50%;
    background:var(--brown-700);
    border:3px solid var(--cream);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(35,17,6,0.28);
  }
  .stat-num{font-family:var(--font-title);font-weight:700;font-size:25px;color:var(--ink-cream);line-height:1;}
  .stat-unit{font-size:10px;color:var(--blue-300);margin-top:2px;}
  .stat-label{margin-top:10px;font-size:13px;color:var(--brown-800);font-weight:700;text-align:center;}
  .stat-label .chev{font-size:10px;margin-left:2px;opacity:.7;}
  .stat-sub{margin-top:2px;font-size:11px;color:var(--brown-600);text-align:center;}

  /* ---------- Calendar card ---------- */
  .calendar-card{
    background:var(--cream-dim);
    border-radius:var(--radius-lg);
    padding:16px 12px 12px;
    margin-bottom:24px;
    box-shadow:var(--shadow);
  }

  /* ---------- Month nav ---------- */
  .monthnav{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;
    padding:0 2px;
  }
  .navbtns{display:flex;gap:6px;}
  .navbtn{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line-cream);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brown-700);
  }
  .navbtn:active{transform:scale(0.92);}
  .mtitlebtn{
    display:flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--line-cream);border-radius:20px;
    padding:8px 16px;cursor:pointer;
  }
  .mtitlebtn:active{transform:scale(0.97);}
  .mtitlebtn .mtitle{font-family:var(--font-title);font-size:16px;font-weight:700;color:var(--brown-800);}
  .mtitlebtn .mchev{color:var(--ship);font-size:11px;}
  .todaybtn{
    font-size:11.5px;color:var(--brown-800);background:var(--blue-300);
    border:none;border-radius:20px;padding:7px 12px;cursor:pointer;font-weight:700;
  }

  /* ---------- Calendar grid ---------- */
  .weekhead{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;}
  .weekhead span{text-align:center;font-size:11px;color:var(--muted-cream);font-weight:500;padding:6px 0;}
  .weekhead span:first-child{color:var(--sun);}
  .weekhead span:last-child{color:var(--sat);}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cell{
    position:relative;
    aspect-ratio:1/1.12;
    border-radius:var(--radius-sm);
    background:var(--cell-bg);
    border:1px solid rgba(59,33,16,0.09);
    padding:5px 4px 4px;
    display:flex;flex-direction:column;
    cursor:pointer;
    overflow:hidden;
  }
  .cell.empty{visibility:hidden;pointer-events:none;}
  .cell:active{background:rgba(59,33,16,0.06);}
  .cell.today{border:2px solid var(--ship);background:#fff;}
  .cell.leave{background:var(--leave-tint);}
  .cell.leave-half{background:linear-gradient(135deg, var(--leave-tint) 50%, var(--cell-bg) 50%);}
  .cell .dnum{font-size:12.5px;font-weight:500;color:var(--ink-dark);}
  .cell.sun .dnum{color:var(--sun);}
  .cell.sat .dnum{color:var(--sat);}
  .cell.holiday .dnum{color:var(--sun);}
  .cell .hname{
    font-size:8.5px;color:var(--sun);line-height:1.1;margin-top:1px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tagrow{margin-top:auto;display:flex;flex-wrap:wrap;gap:2px;}
  .tag{font-size:8px;border-radius:5px;padding:1px 3px;font-weight:700;line-height:1.3;}
  .tag.leave{background:var(--leave);color:var(--ink-dark);}
  .tag.ship{background:var(--ship);color:#fff;}
  .tag.pay{background:var(--pay);color:#fff;}
  .memodot{
    position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--brown-500);
  }

  /* ---------- Legend ---------- */
  .legend{display:flex;gap:14px;justify-content:center;margin-bottom:26px;flex-wrap:wrap;}
  .legend .li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted-brown);}
  .legend .dot{width:9px;height:9px;border-radius:3px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,7,3,0.55);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--cream);color:var(--ink-dark);width:100%;max-width:480px;
    border-radius:22px 22px 0 0;padding:20px 20px 28px;
    max-height:88vh;overflow-y:auto;
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .sheet-title{font-family:var(--font-title);font-size:18px;font-weight:700;color:var(--brown-700);}
  .sheet-close{background:none;border:none;font-size:20px;color:var(--muted-cream);cursor:pointer;padding:4px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--muted-cream);margin-bottom:6px;font-weight:500;}
  .field input[type=text], .field input[type=number], .field textarea{
    width:100%;border:1px solid var(--line-cream);border-radius:var(--radius-sm);
    padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink-dark);
  }
  .field input[type=date]{
    width:100%;border:1px solid var(--line-cream);border-radius:var(--radius-sm);
    padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink-dark);
    -webkit-appearance:none;appearance:none;
    min-height:40px;line-height:20px;
    display:block;overflow:hidden;
  }
  .field textarea{resize:vertical;min-height:64px;}

  .switchrow{display:flex;align-items:center;justify-content:space-between;
    background:#fff;border:1px solid var(--line-cream);border-radius:var(--radius-sm);
    padding:12px 14px;margin-bottom:16px;}
  .switchrow .swlabel{font-size:14px;font-weight:500;}
  .switch{position:relative;width:44px;height:26px;border-radius:20px;background:var(--brown-500);cursor:pointer;flex:none;transition:.15s;opacity:.35;}
  .switch.on{background:var(--leave);opacity:1;}

<script>
const YEAR_MIN = 2026, YEAR_MAX = 2027;
const HOLIDAYS = {
  2026: [
    ['2026-01-01','신정'],
    ['2026-02-16','설날 연휴'],
    ['2026-02-17','설날'],
    ['2026-02-18','설날 연휴'],
    ['2026-03-01','삼일절'],
    ['2026-03-02','삼일절 대체공휴일'],
    ['2026-05-01','노동절'],
    ['2026-05-05','어린이날'],
    ['2026-05-24','부처님오신날'],
    ['2026-05-25','부처님오신날 대체공휴일'],
    ['2026-06-03','지방선거일'],
    ['2026-06-06','현충일'],
    ['2026-07-17','제헌절'],
    ['2026-08-15','광복절'],
    ['2026-08-17','광복절 대체공휴일'],
    ['2026-09-24','추석 연휴'],
    ['2026-09-25','추석'],
    ['2026-09-26','추석 연휴'],
    ['2026-10-03','개천절'],
    ['2026-10-05','개천절 대체공휴일'],
    ['2026-10-09','한글날'],
    ['2026-12-25','기독탄신일'],
  ],
  2027: [
    ['2027-01-01','신정'],
    ['2027-02-06','설날 연휴'],
    ['2027-02-07','설날'],
    ['2027-02-08','설날 연휴'],
    ['2027-02-09','설날 대체공휴일'],
    ['2027-03-01','삼일절'],
    ['2027-05-01','노동절'],
    ['2027-05-05','어린이날'],
    ['2027-05-13','부처님오신날'],
    ['2027-06-06','현충일'],
    ['2027-07-17','제헌절'],
    ['2027-08-15','광복절'],
    ['2027-08-16','광복절 대체공휴일'],
    ['2027-09-14','추석 연휴'],
    ['2027-09-15','추석'],
    ['2027-09-16','추석 연휴'],
    ['2027-10-03','개천절'],
    ['2027-10-04','개천절 대체공휴일'],
    ['2027-10-09','한글날'],
    ['2027-10-11','한글날 대체공휴일'],
    ['2027-12-25','기독탄신일'],
    ['2027-12-27','기독탄신일 대체공휴일'],
  ],
};
const ALL_HOLIDAYS = HOLIDAYS[2026].concat(HOLIDAYS[2027]);
const SHIP_BASES = [4,9,14,19,24,29];
const PAY_BASE = 5;

let settings = { leaveStart:'', leaveEnd:'', leaveTotal:null, removedHolidays:[], extraHolidays:[] };
let events = {};
let shipOverrides = {};
let payOverrides = {};
let curYear = YEAR_MIN, curMonth = 8;
let openDate = null;

function leaveWeight(ev){
  if(!ev) return 0;
  if(ev.leaveType==='full') return 1;
  if(ev.leaveType==='half') return 0.5;
  return 0;
}

function fmt(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return fmt(new Date()); }
function parseYMD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }

function getHolidayMap(){
  const map = {};
  ALL_HOLIDAYS.forEach(([d,n])=>{ if(!settings.removedHolidays.includes(d)) map[d]=n; });
  (settings.extraHolidays||[]).forEach(h=>{ map[h.date]=h.name||'휴무일'; });
  return map;
}

function isWorkday(dateStr, holidayMap){
  const d = parseYMD(dateStr);
  const dow = d.getDay();
  if(dow===0||dow===6) return false;
  if(holidayMap[dateStr]) return false;
  return true;
}

function computeShippingDate(year, month, baseDay, holidayMap){
  const dim = daysInMonth(year,month);
  const day = Math.min(baseDay,dim);
  let d = new Date(year, month-1, day);
  let guard = 0;
  while(guard<40){
    const dow = d.getDay();
    const ds = fmt(d);
    if(dow!==0 && dow!==6 && !holidayMap[ds]) break;
    d = addDays(d,-1);
    guard++;
  }
  return fmt(d);
}

function getMonthShipping(year, month, holidayMap){
  return SHIP_BASES.map(baseDay=>{
    const key = year+'-'+month+'-'+baseDay;
    const defaultDate = computeShippingDate(year,month,baseDay,holidayMap);
    const ov = shipOverrides[key];
    let actualDate = defaultDate, note = '', cancelled = false;
    if(ov){
      if(ov.cancelled) cancelled = true;
      if(ov.date) actualDate = ov.date;
      note = ov.note || '';
    }
    return { key, baseDay, defaultDate, actualDate, note, cancelled };
  });
}

function getMonthPayday(year, month, holidayMap){
  const key = year+'-'+month;
  const defaultDate = computeShippingDate(year,month,PAY_BASE,holidayMap);
  const ov = payOverrides[key];
  let actualDate = defaultDate, note = '', cancelled = false;
  if(ov){
    if(ov.cancelled) cancelled = true;
    if(ov.date) actualDate = ov.date;
    note = ov.note || '';
  }
  return { key, defaultDate, actualDate, note, cancelled };
}

function calcRemainingThisYear(){
  const holidayMap = getHolidayMap();
  const today = todayStr();
  const thisYear = Math.max(YEAR_MIN, Math.min(YEAR_MAX, new Date().getFullYear()));
  const end = new Date(thisYear,11,31);
  let d = parseYMD(today);
  if(d.getFullYear()!==thisYear) d = new Date(thisYear,0,1);
  let count = 0, leaveAhead = 0;
  while(d<=end){
    const ds = fmt(d);
    if(isWorkday(ds,holidayMap)){
      count++;
      leaveAhead += leaveWeight(events[ds]);
    }
    d = addDays(d,1);
  }
  return { count, leaveAhead };
}

function calcLeaveInfo(){
  if(!settings.leaveStart || !settings.leaveEnd || settings.leaveTotal===null || settings.leaveTotal===undefined) return null;
  const dates = Object.keys(events)
    .filter(ds=> leaveWeight(events[ds])>0 && ds>=settings.leaveStart && ds<=settings.leaveEnd)
    .sort();
  const used = dates.reduce((sum,ds)=> sum + leaveWeight(events[ds]), 0);
  const remaining = settings.leaveTotal - used;
  return { remaining, used, total: settings.leaveTotal, dates };
}

function fmtNum(n){
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function renderStats(){
  const rem = calcRemainingThisYear();
  document.getElementById('statRemain').textContent = rem.count;
  document.getElementById('statRemainSub').textContent = rem.leaveAhead>0 ? ('연차 '+fmtNum(rem.leaveAhead)+'일 포함') : '오늘~12/31';

  const info = calcLeaveInfo();
  document.getElementById('statLeave').textContent = info===null ? '-' : fmtNum(info.remaining);
  document.getElementById('statLeaveSub').textContent = info===null ? '설정 필요' : (fmtNum(info.used)+'개 사용');

  document.getElementById('setupNotice').style.display = info===null ? 'block' : 'none';
}

function renderMonthTitle(){
  document.getElementById('monthTitle').textContent = curYear+'년 '+curMonth+'월';
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const holidayMap = getHolidayMap();
  const shipping = getMonthShipping(curYear,curMonth,holidayMap);
  const shipByDate = {};
  shipping.forEach(s=>{ if(!s.cancelled){ (shipByDate[s.actualDate] = shipByDate[s.actualDate]||[]).push(s); } });
  const payday = getMonthPayday(curYear,curMonth,holidayMap);

  const firstDow = new Date(curYear,curMonth-1,1).getDay();
  const dim = daysInMonth(curYear,curMonth);
  const today = todayStr();

  for(let i=0;i<firstDow;i++){
    const e = document.createElement('div');
    e.className = 'cell empty';
    grid.appendChild(e);
  }

  for(let day=1; day<=dim; day++){

async function saveDay(){
  const ds = openDate;
  if(!ds) return;
  const activeSeg = document.querySelector('#leaveSeg .segbtn.active');
  const leaveType = activeSeg ? (activeSeg.dataset.val||'') : '';
  const memo = document.getElementById('memoInput').value.trim();
  if(leaveType || memo){
    events[ds] = { leaveType, memo };
  } else {
    delete events[ds];
  }

  document.querySelectorAll('.shipcard').forEach(card=>{
    const key = card.dataset.key;
    const dateVal = card.querySelector('.shipDateInput').value;
    const noteVal = card.querySelector('.shipNoteInput').value.trim();
    const existing = shipOverrides[key] || {};
    const cancelled = existing.cancelled || false;
    shipOverrides[key] = { date: dateVal || null, note: noteVal, cancelled };
  });

  const payCard = document.querySelector('.paycard');
  if(payCard){
    const key = payCard.dataset.key;
    const dateVal = document.getElementById('payDateInput').value;
    const noteVal = document.getElementById('payNoteInput').value.trim();
    const existing = payOverrides[key] || {};
    const cancelled = existing.cancelled || false;
    payOverrides[key] = { date: dateVal || null, note: noteVal, cancelled };
  }

  await saveAllState();
  closeDay();
  renderAll();
}

function addSingleEventToCalendar(title, ds, desc){
  if(hasClaudeStorage){
    // Claude 아티팩트 안에는 서버 함수가 없으니, Blob URL + 실제 <a> 클릭으로
    // iOS Safari가 최대한 안정적으로 "캘린더에 추가"를 인식하도록 해요.
    const ics = singleEventICS(title, ds, desc);
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    // download 속성을 주지 않아야 iOS가 파일로 조용히 저장하지 않고
    // 캘린더 앱으로 바로 넘겨주는 미리보기를 띄워요.
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    return;
  }
  const params = new URLSearchParams({ title: title, date: ds.replace(/-/g,''), desc: desc||'' });
  window.location.href = '/.netlify/functions/ics?' + params.toString();
}

function migrateEvents(evObj){
  const out = {};
  Object.keys(evObj||{}).forEach(ds=>{

    if(e && e.leaveType===undefined && e.leave!==undefined){
      out[ds] = { leaveType: e.leave ? 'full' : '', memo: e.memo || '' };

  });
  return out;
}

function applyLoadedBlob(blob){
  if(blob.settings){
    const loaded = blob.settings;
    if(loaded.baseDate && !loaded.leaveStart){
      loaded.leaveStart = loaded.baseDate;
      loaded.leaveTotal = (loaded.leaveTotal===undefined||loaded.leaveTotal===null) ? loaded.baseLeaveCount : loaded.leaveTotal;
    }
    settings = Object.assign(settings, loaded);
  }
  events = migrateEvents(blob.events || {});
  shipOverrides = blob.shipOverrides || {};
  payOverrides = blob.payOverrides || {};
}

/* Netlify Functions + Netlify Blobs 기반 동기화 (Supabase 없이) */
async function fetchRemote(){
  const res = await fetch('/.netlify/functions/sync?key='+encodeURIComponent(syncConfig.syncKey));
  if(!res.ok) throw new Error('fetch failed: '+res.status);
  const json = await res.json();
  return json.data;
}
async function pushRemote(blob){
  const res = await fetch('/.netlify/functions/sync?key='+encodeURIComponent(syncConfig.syncKey), {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(blob)
  });
  if(!res.ok) throw new Error('push failed: '+res.status);
}

/* ---------- 동기화 안전장치: 빈 데이터가 기존 데이터를 덮어쓰지 않도록 ---------- */
function blobHasContent(b){
  if(!b) return false;
  const s = b.settings || {};
  const hasTotal = s.leaveTotal!==null && s.leaveTotal!==undefined && s.leaveTotal!=='';
  return !!(s.leaveStart || s.leaveEnd || hasTotal ||
    (s.extraHolidays && s.extraHolidays.length) || (s.removedHolidays && s.removedHolidays.length) ||
    Object.keys(b.events||{}).length || Object.keys(b.shipOverrides||{}).length || Object.keys(b.payOverrides||{}).length);
}
function pickBlob(local, remote){
  const lc = blobHasContent(local), rc = blobHasContent(remote);
  if(!rc) return { blob: local, source: 'local' };
  if(!lc) return { blob: remote, source: 'remote' };
  const lt = (local && local.updatedAt) || 0, rt = (remote && remote.updatedAt) || 0;
  return rt > lt ? { blob: remote, source: 'remote' } : { blob: local, source: 'local' };
}
function readLocalBlob(){
  try{ const raw = localStorage.getItem('workcal_local'); return raw ? JSON.parse(raw) : null; }
  catch(err){ return null; }
}
async function reconcileWithRemote(){
  const local = readLocalBlob();
  const remote = await fetchRemote();
  const pick = pickBlob(local, remote);
  if(!pick.blob) return '새 동기화 코드예요. 저장하면 이 코드로 백업돼요.';
  if(pick.source === 'remote'){
    if(blobHasContent(local)) localStorage.setItem('workcal_backup', JSON.stringify(local));
    applyLoadedBlob(pick.blob);
    localStorage.setItem('workcal_local', JSON.stringify(pick.blob));
    return '다른 기기의 최신 데이터를 불러왔어요. 동기화됨.';
  }
  applyLoadedBlob(pick.blob);
  if(blobHasContent(pick.blob)){
    const stamped = Object.assign({}, pick.blob, { updatedAt: pick.blob.updatedAt || Date.now() });
    localStorage.setItem('workcal_local', JSON.stringify(stamped));
    if(!remote || remote.updatedAt !== stamped.updatedAt) await pushRemote(stamped);
    return '이 기기의 데이터로 동기화했어요.';
  }
  return '이 코드로 저장된 데이터가 아직 없어요 (새로 시작)';
}

async function saveAllState(){
  if(hasClaudeStorage){
    await persistSettings();
    await persistEvents();
    await persistShipping();
    await persistPay();
    return;
  }
  const blob = { settings, events, shipOverrides, payOverrides, updatedAt: Date.now() };
  localStorage.setItem('workcal_local', JSON.stringify(blob));
  if(syncConfig.syncKey && blobHasContent(blob)){
    try{
      await pushRemote(blob);
      setSyncStatusText('마지막 동기화: '+new Date().toLocaleTimeString());
    }catch(err){
      console.error('동기화 저장 실패', err);
      setSyncStatusText('동기화 실패 (이 기기에는 저장됨)');
    }
  }
}

async function loadAllState(){
  if(hasClaudeStorage){
    await loadFromClaude();
    return;
  }
  if(syncConfig.syncKey){
    try{
      setSyncStatusText(await reconcileWithRemote());
      return;
    }catch(err){
      console.error('동기화 불러오기 실패', err);
      setSyncStatusText('동기화 실패 - 이 기기의 데이터를 표시해요');
    }
  }
  const local = readLocalBlob();
  if(local) applyLoadedBlob(local);
}

document.getElementById('syncConnectBtn').addEventListener('click', async ()=>{
  const code = document.getElementById('syncCodeInput').value.trim();
  if(!code){
    setSyncStatusText('동기화 코드를 입력해주세요.');
    return;
  }
  syncConfig = { syncKey: code };
  localStorage.setItem('workcal_syncconfig', JSON.stringify(syncConfig));
  setSyncStatusText('연결하는 중…');
  try{
    setSyncStatusText(await reconcileWithRemote());
    renderAll();
    renderHolidayList();
    renderCustomHolidayList();
    document.getElementById('leaveStartInput').value = settings.leaveStart || '';
    document.getElementById('leaveEndInput').value = settings.leaveEnd || '';
    document.getElementById('leaveTotalInput').value = settings.leaveTotal===null||settings.leaveTotal===undefined ? '' : settings.leaveTotal;
  }catch(err){
    console.error(err);
    setSyncStatusText('연결 실패 - 배포가 완료됐는지, 함수가 켜져 있는지 확인해주세요.');
  }
});

/* ---------- Apple 캘린더용 .ics 내보내기 ---------- */
function icsDate(ds){ return ds.replace(/-/g,''); }
function icsDateNext(ds){
  const d = parseYMD(ds);
  d.setDate(d.getDate()+1);
  return fmt(d).replace(/-/g,'');
}
function icsEscape(text){
  return String(text||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function singleEventICS(title, ds, desc){
  const now = new Date();
  const stamp = fmt(now).replace(/-/g,'')+'T'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0')+String(now.getSeconds()).padStart(2,'0');
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//work-calendar//KR','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:'+Date.now()+'-'+Math.random().toString(36).slice(2)+'@work-calendar.app',
    'DTSTAMP:'+stamp,
    'DTSTART;VALUE=DATE:'+icsDate(ds),
    'DTEND;VALUE=DATE:'+icsDateNext(ds),
    'SUMMARY:'+icsEscape(title)
  ];
  if(desc) lines.push('DESCRIPTION:'+icsEscape(desc));
  lines.push('END:VEVENT','END:VCALENDAR');
  return lines.join('\r\n');
}

(async function init(){
  const d = new Date();
  const y = Math.max(YEAR_MIN, Math.min(YEAR_MAX, d.getFullYear()));
  curYear = y;
  curMonth = (d.getFullYear()===y) ? d.getMonth()+1 : 1;
  if(!hasClaudeStorage){
    document.getElementById('syncSection').style.display = 'block';
    if(syncConfig.url && syncConfig.anonKey && syncConfig.syncKey){
      setSyncStatusText('연결 확인 중…');
    }
  }
  await loadAllState();
  renderAll();
  if(!settings.leaveStart || !settings.leaveEnd || settings.leaveTotal===null || settings.leaveTotal===undefined){
    openSettings();
  }
})();
