    --blue-200:#DCEEF2;
    --blue-300:#C5E0E6;
    --blue-400:#A9CFD8;
    --blue-500:#7FB3C0;
    --ink-cream:#F6ECDF;
    --ink-dark:#2E1F16;
    --muted-brown:#C7AE97;
    --muted-cream:#8C7A6B;
    --line-brown:rgba(246,236,223,0.14);
    --line-cream:#DCC9A9;
    --leave:#D9973F;
    --leave-tint:#F4E2C6;
    --ship:#3E6E78;
    --ship-tint:#D8E9EC;
    --pay:#8A7A2E;
    --pay-tint:#EDE7C6;
    --sun:#D07A5E;
    --sat:#7FB3C0;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow:0 10px 26px rgba(15,7,3,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--brown-900);
    color:var(--ink-cream);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 16px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 0 16px;
  }
  .brand{font-family:'Noto Serif KR',serif;}
  .brand .b1{font-size:23px;font-weight:700;color:var(--ink-cream);}
  .brand .b2{font-size:23px;font-weight:400;color:var(--blue-300);margin-left:2px;}
  .brand .sub{display:block;font-size:11px;color:var(--muted-brown);margin-top:3px;letter-spacing:.02em;}
  .iconbtn{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line-brown);
    background:var(--brown-700);display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--blue-300);flex:none;
  }
  .iconbtn:active{transform:scale(0.94);}
  .iconbtn svg{width:18px;height:18px;}

  /* ---------- Stat panel (signature element) ---------- */
  .stat-panel{
    position:relative;
    border-radius:var(--radius-lg);
    background:var(--blue-300);
    padding:24px 16px 20px;
    margin-bottom:22px;
    box-shadow:var(--shadow);
  }
  .stat-row{display:flex;justify-content:center;gap:20px;}
  .stat-item{display:flex;flex-direction:column;align-items:center;flex:1;max-width:180px;min-width:0;}
  .stat-item.clickable{cursor:pointer;}
  .stat-item.clickable:active{transform:scale(0.97);}
  .stat-ring{
    width:92px;height:92px;border-radius:50%;
    background:var(--brown-700);
    border:3px solid var(--cream);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(35,17,6,0.28);
  }
  .stat-num{font-family:'Noto Serif KR',serif;font-weight:700;font-size:25px;color:var(--ink-cream);line-height:1;}
  .stat-unit{font-size:10px;color:var(--blue-300);margin-top:2px;}
  .stat-label{margin-top:10px;font-size:13px;color:var(--brown-800);font-weight:700;text-align:center;}
  .stat-label .chev{font-size:10px;margin-left:2px;opacity:.7;}
  .stat-sub{margin-top:2px;font-size:11px;color:var(--brown-600);text-align:center;}

  /* ---------- Calendar card ---------- */
  .calendar-card{
    background:var(--cream-dim);
    border-radius:var(--radius-lg);
    padding:16px 12px 12px;
    margin-bottom:24px;
    box-shadow:var(--shadow);
  }

  /* ---------- Month nav ---------- */
  .monthnav{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;
    padding:0 2px;
  }
  .navbtns{display:flex;gap:6px;}
  .navbtn{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line-cream);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brown-700);
  }
  .navbtn:active{transform:scale(0.92);}
  .mtitlebtn{
    display:flex;align-items:center;gap:6px;
    background:#fff;border:1px solid var(--line-cream);border-radius:20px;
    padding:8px 16px;cursor:pointer;
  }
  .mtitlebtn:active{transform:scale(0.97);}
  .mtitlebtn .mtitle{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--brown-800);}
  .mtitlebtn .mchev{color:var(--ship);font-size:11px;}
  .todaybtn{
    font-size:11.5px;color:var(--brown-800);background:var(--blue-300);
    border:none;border-radius:20px;padding:7px 12px;cursor:pointer;font-weight:700;
  }

  /* ---------- Calendar grid ---------- */
  .weekhead{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;}
  .weekhead span{text-align:center;font-size:11px;color:var(--muted-cream);font-weight:500;padding:6px 0;}
  .weekhead span:first-child{color:var(--sun);}
  .weekhead span:last-child{color:var(--sat);}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cell{
    position:relative;
    aspect-ratio:1/1.12;
    border-radius:var(--radius-sm);
    background:var(--cell-bg);
    border:1px solid rgba(59,33,16,0.09);
    padding:5px 4px 4px;
    display:flex;flex-direction:column;
    cursor:pointer;
    overflow:hidden;
  }
  .cell.empty{visibility:hidden;pointer-events:none;}
  .cell:active{background:rgba(59,33,16,0.06);}
  .cell.today{border:2px solid var(--ship);background:#fff;}
  .cell.leave{background:var(--leave-tint);}
  .cell.leave-half{background:linear-gradient(135deg, var(--leave-tint) 50%, var(--cell-bg) 50%);}
  .cell .dnum{font-size:12.5px;font-weight:500;color:var(--ink-dark);}
  .cell.sun .dnum{color:var(--sun);}
  .cell.sat .dnum{color:var(--sat);}
  .cell.holiday .dnum{color:var(--sun);}
  .cell .hname{
    font-size:8.5px;color:var(--sun);line-height:1.1;margin-top:1px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tagrow{margin-top:auto;display:flex;flex-wrap:wrap;gap:2px;}
  .tag{font-size:8px;border-radius:5px;padding:1px 3px;font-weight:700;line-height:1.3;}
  .tag.leave{background:var(--leave);color:var(--ink-dark);}
  .tag.ship{background:var(--ship);color:#fff;}
  .tag.pay{background:var(--pay);color:#fff;}
  .memodot{
    position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--brown-500);
  }

  /* ---------- Legend ---------- */
  .legend{display:flex;gap:14px;justify-content:center;margin-bottom:26px;flex-wrap:wrap;}
  .legend .li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted-brown);}
  .legend .dot{width:9px;height:9px;border-radius:3px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,7,3,0.55);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--cream);color:var(--ink-dark);width:100%;max-width:480px;
    border-radius:22px 22px 0 0;padding:20px 20px 28px;
    max-height:88vh;overflow-y:auto;
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .sheet-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;color:var(--brown-700);}
  .sheet-close{background:none;border:none;font-size:20px;color:var(--muted-cream);cursor:pointer;padding:4px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--muted-cream);margin-bottom:6px;font-weight:500;}
  .field input[type=text], .field input[type=number], .field textarea{
    width:100%;border:1px solid var(--line-cream);border-radius:var(--radius-sm);
    padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink-dark);
  }
  .field input[type=date]{
    width:100%;border:1px solid var(--line-cream);border-radius:var(--radius-sm);
    padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink-dark);
    -webkit-appearance:none;appearance:none;
    min-height:40px;line-height:20px;
    display:block;overflow:hidden;
  }
  .field textarea{resize:vertical;min-height:64px;}

  .switchrow{display:flex;align-items:center;justify-content:space-between;
    background:#fff;border:1px solid var(--line-cream);border-radius:var(--radius-sm);
    padding:12px 14px;margin-bottom:16px;}
  .switchrow .swlabel{font-size:14px;font-weight:500;}
  .switch{position:relative;width:44px;height:26px;border-radius:20px;background:var(--brown-500);cursor:pointer;flex:none;transition:.15s;opacity:.35;}
  .switch.on{background:var(--leave);opacity:1;}
  .switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,0.2);}
  .switch.on .knob{left:21px;}

  .segrow{display:flex;gap:6px;}
  .segbtn{
    flex:1;padding:11px 0;border-radius:var(--radius-sm);border:1px solid var(--line-cream);
    background:#fff;color:var(--muted-cream);font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .segbtn.active{background:var(--brown-700);color:var(--cream);border-color:var(--brown-700);}
  .segbtn[data-val="half"].active{background:var(--leave);border-color:var(--leave);color:var(--ink-dark);}

  .paycard{
    background:#fff;border:1px solid var(--line-cream);border-radius:var(--radius-md);
    padding:14px;margin-bottom:14px;
  }
  .paycard .shead{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .paycard .sbadge{
    background:var(--pay-tint);color:var(--pay);font-size:11px;font-weight:700;
    border-radius:6px;padding:3px 7px;
  }

  .shipcard{
    background:#fff;border:1px solid var(--line-cream);border-radius:var(--radius-md);
    padding:14px;margin-bottom:14px;
  }
  .shipcard .shead{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .shipcard .sbadge{
    background:var(--ship-tint);color:var(--ship);font-size:11px;font-weight:700;
    border-radius:6px;padding:3px 7px;
  }
  .shipcard .snote{font-size:11px;color:var(--muted-cream);}
  .btnrow{display:flex;gap:8px;margin-top:18px;}
  .btn{
    flex:1;border-radius:var(--radius-sm);border:none;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .btn.primary{background:var(--brown-700);color:var(--cream);}
  .btn.primary:active{background:var(--brown-800);}
  .btn.ghost{background:#fff;color:var(--brown-700);border:1px solid var(--line-cream);}
  .btn.danger{background:var(--leave-tint);color:#8a5717;}
  .smalltext{font-size:11px;color:var(--muted-cream);line-height:1.5;margin-top:4px;}

  .hlist{max-height:180px;overflow-y:auto;border:1px solid var(--line-cream);border-radius:var(--radius-sm);background:#fff;}
  .hrow{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line-cream);font-size:12.5px;gap:8px;}
  .hrow:last-child{border-bottom:none;}
  .hrow .hd{color:var(--muted-cream);width:64px;flex:none;}
  .hrow .hn{flex:1;}
  .chk{width:17px;height:17px;accent-color:var(--brown-700);flex:none;}
  .addrow{display:flex;gap:6px;margin-top:10px;}
  .addrow input{flex:1;}
  .addrow input[type=date]{flex:1.1;}
  .xbtn{
    background:var(--leave-tint);color:#8a5717;border:none;border-radius:8px;
    width:30px;height:30px;font-size:14px;cursor:pointer;flex:none;
  }
  .footnote{text-align:center;font-size:11px;color:var(--muted-brown);margin:8px 0 30px;line-height:1.6;}

  /* ---------- Month picker ---------- */
  .yeartabs{display:flex;gap:8px;margin-bottom:14px;}
  .yeartab{
    flex:1;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--line-cream);
    background:#fff;color:var(--brown-700);font-weight:700;font-size:14px;cursor:pointer;text-align:center;
  }
  .yeartab.active{background:var(--brown-700);color:var(--cream);border-color:var(--brown-700);}
  .monthgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .monthbtn{
    padding:14px 0;border-radius:var(--radius-sm);border:1px solid var(--line-cream);
    background:#fff;color:var(--ink-dark);font-size:14px;font-weight:500;cursor:pointer;text-align:center;
  }
  .monthbtn.active{background:var(--blue-300);border-color:var(--blue-400);color:var(--brown-800);font-weight:700;}
  .monthbtn.istoday{box-shadow:inset 0 0 0 2px var(--ship);}

  /* ---------- Leave history ---------- */
  .lh-summary{display:flex;gap:10px;margin-bottom:16px;}
  .lh-box{flex:1;background:#fff;border:1px solid var(--line-cream);border-radius:var(--radius-md);padding:12px;text-align:center;}
  .lh-box .lv{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700;color:var(--brown-700);}
  .lh-box .ll{font-size:11px;color:var(--muted-cream);margin-top:3px;}
  .lh-list .lh-row{
    display:flex;align-items:center;justify-content:space-between;
    background:#fff;border:1px solid var(--line-cream);border-radius:var(--radius-sm);
    padding:11px 13px;margin-bottom:8px;
  }
  .lh-row .lhd{font-size:13.5px;font-weight:700;color:var(--ink-dark);}
  .lh-row .lhm{font-size:11.5px;color:var(--muted-cream);margin-top:2px;}
  .lh-empty{text-align:center;color:var(--muted-cream);font-size:13px;padding:30px 0;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div><span class="b1">출근</span><span class="b2">다이어리</span></div>
      <span class="sub">나의 근무 기록</span>
    </div>
    <button class="iconbtn" id="settingsBtn" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <div class="stat-panel">
    <div class="stat-row">
      <div class="stat-item">
        <div class="stat-ring"><span class="stat-num" id="statRemain">-</span><span class="stat-unit">일</span></div>
        <div class="stat-label">올해 남은 출근일</div>
        <div class="stat-sub" id="statRemainSub"></div>
      </div>
      <div class="stat-item clickable" id="leaveStatItem">
        <div class="stat-ring"><span class="stat-num" id="statLeave">-</span><span class="stat-unit">개</span></div>
        <div class="stat-label">남은 연차<span class="chev">›</span></div>
        <div class="stat-sub" id="statLeaveSub"></div>
      </div>
    </div>
  </div>

  <div class="calendar-card">
    <div class="monthnav">
      <div class="navbtns">
        <button class="navbtn" id="prevBtn" aria-label="이전 달">‹</button>
        <button class="navbtn" id="nextBtn" aria-label="다음 달">›</button>
      </div>
      <button class="mtitlebtn" id="monthTitleBtn">
        <span class="mtitle" id="monthTitle">2026년 8월</span>
        <span class="mchev">▾</span>
      </button>
      <button class="todaybtn" id="todayBtn">오늘</button>
    </div>

    <div class="weekhead"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="legend">
    <div class="li"><span class="dot" style="background:var(--leave)"></span>연차</div>
    <div class="li"><span class="dot" style="background:linear-gradient(135deg, var(--leave) 50%, var(--cell-bg) 50%)"></span>반차</div>
    <div class="li"><span class="dot" style="background:var(--ship)"></span>정기배송</div>
    <div class="li"><span class="dot" style="background:var(--pay)"></span>월급일</div>
    <div class="li"><span class="dot" style="background:var(--sun)"></span>공휴일</div>
    <div class="li"><span class="dot" style="background:var(--brown-500);border-radius:50%"></span>메모</div>
  </div>

  <div class="footnote" id="setupNotice" style="display:none;">
    설정에서 연차 사용 기간과 총 연차 개수를 먼저 입력해주세요.
  </div>
  <div class="footnote">
    2026~2027년 대한민국 법정공휴일 기준으로 계산돼요.
  </div>
</div>

<div class="overlay" id="dayOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <span class="sheet-title" id="dayTitle">8월 7일 (금)</span>
      <button class="sheet-close" id="dayClose">✕</button>
    </div>
    <div id="dayHolidayNote" class="smalltext" style="display:none;margin-bottom:12px;"></div>

    <div class="field">
      <label>연차 종류</label>
      <div class="segrow" id="leaveSeg">
        <button type="button" class="segbtn active" data-val="">없음</button>
        <button type="button" class="segbtn" data-val="full">연차</button>
        <button type="button" class="segbtn" data-val="half">반차</button>
      </div>
      <button type="button" class="btn ghost" id="leaveIcsBtn" style="width:100%;margin-top:10px;" disabled>🗓 이 연차 캘린더에 추가</button>
    </div>

    <div class="field">
      <label>메모 (다음 출근 준비물 등)</label>
      <textarea id="memoInput" placeholder="예: 우산, 발표자료 인쇄물 챙기기"></textarea>
    </div>

    <div id="shipArea"></div>
    <div id="payArea"></div>

    <div class="btnrow">
      <button class="btn ghost" id="dayCancel">닫기</button>
      <button class="btn primary" id="daySave">저장</button>
    </div>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <span class="sheet-title">설정</span>
      <button class="sheet-close" id="settingsClose">✕</button>
    </div>

    <div class="field">
      <label>연차 사용 기간 시작일</label>
      <input type="date" id="leaveStartInput">
    </div>
    <div class="field">
      <label>연차 사용 기간 종료일</label>
      <input type="date" id="leaveEndInput">
    </div>
    <div class="field">
      <label>이 기간 동안 사용 가능한 총 연차 개수</label>
      <input type="number" id="leaveTotalInput" min="0" step="0.5" placeholder="예: 15">
      <div class="smalltext">기간 안에서 연차로 표시한 날짜 수만큼 자동으로 차감돼요. 연도가 걸쳐도 그대로 계산돼요.</div>
    </div>

    <div class="field" id="syncSection" style="display:none;">
      <label>기기 간 동기화 (선택)</label>
      <input type="text" id="syncCodeInput" placeholder="동기화 코드 (모든 기기에 동일하게 입력)">
      <div class="smalltext" id="syncStatusText">동기화 미설정: 이 기기에만 저장돼요.</div>
      <button class="btn ghost" style="margin-top:8px;" id="syncConnectBtn">연결</button>
    </div>

    <div class="field">
      <label>공휴일 제외 (근무처 사정에 맞게 체크 해제)</label>
      <div class="hlist" id="holidayList"></div>
    </div>

    <div class="field">
      <label>사용자 지정 공휴일 / 휴무일 추가</label>
      <div class="addrow">

<script>
const YEAR_MIN = 2026, YEAR_MAX = 2027;
const HOLIDAYS = {
  2026: [
    ['2026-01-01','신정'],
    ['2026-02-16','설날 연휴'],
    ['2026-02-17','설날'],
    ['2026-02-18','설날 연휴'],
    ['2026-03-01','삼일절'],
    ['2026-03-02','삼일절 대체공휴일'],
    ['2026-05-01','노동절'],
    ['2026-05-05','어린이날'],
    ['2026-05-24','부처님오신날'],
    ['2026-05-25','부처님오신날 대체공휴일'],
    ['2026-06-03','지방선거일'],
    ['2026-06-06','현충일'],
    ['2026-07-17','제헌절'],
    ['2026-08-15','광복절'],

    ['2026-09-24','추석 연휴'],
    ['2026-09-25','추석'],
    ['2026-09-26','추석 연휴'],
    ['2026-10-03','개천절'],
    ['2026-10-05','개천절 대체공휴일'],
    ['2026-10-09','한글날'],
    ['2026-12-25','기독탄신일'],
  ],
  2027: [
    ['2027-01-01','신정'],
    ['2027-02-06','설날 연휴'],
    ['2027-02-07','설날'],
    ['2027-02-08','설날 연휴'],
    ['2027-02-09','설날 대체공휴일'],
    ['2027-03-01','삼일절'],
    ['2027-05-01','노동절'],
    ['2027-05-05','어린이날'],
    ['2027-05-13','부처님오신날'],
    ['2027-06-06','현충일'],
    ['2027-07-17','제헌절'],
    ['2027-08-15','광복절'],
    ['2027-08-16','광복절 대체공휴일'],
    ['2027-09-14','추석 연휴'],
    ['2027-09-15','추석'],
    ['2027-09-16','추석 연휴'],
    ['2027-10-03','개천절'],
    ['2027-10-04','개천절 대체공휴일'],
    ['2027-10-09','한글날'],
    ['2027-10-11','한글날 대체공휴일'],
    ['2027-12-25','기독탄신일'],
    ['2027-12-27','기독탄신일 대체공휴일'],
  ],
};
const ALL_HOLIDAYS = HOLIDAYS[2026].concat(HOLIDAYS[2027]);
const SHIP_BASES = [4,9,14,19,24,29];
const PAY_BASE = 5;

let settings = { leaveStart:'', leaveEnd:'', leaveTotal:null, removedHolidays:[], extraHolidays:[] };
let events = {};
let shipOverrides = {};
let payOverrides = {};
let curYear = YEAR_MIN, curMonth = 8;
let openDate = null;

function leaveWeight(ev){
  if(!ev) return 0;
  if(ev.leaveType==='full') return 1;
  if(ev.leaveType==='half') return 0.5;
  return 0;
}

function fmt(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return fmt(new Date()); }
function parseYMD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }

function getHolidayMap(){
  const map = {};
  ALL_HOLIDAYS.forEach(([d,n])=>{ if(!settings.removedHolidays.includes(d)) map[d]=n; });
  (settings.extraHolidays||[]).forEach(h=>{ map[h.date]=h.name||'휴무일'; });
  return map;
}

function isWorkday(dateStr, holidayMap){
  const d = parseYMD(dateStr);
  const dow = d.getDay();
  if(dow===0||dow===6) return false;
  if(holidayMap[dateStr]) return false;
  return true;
}

function computeShippingDate(year, month, baseDay, holidayMap){
  const dim = daysInMonth(year,month);
  const day = Math.min(baseDay,dim);
  let d = new Date(year, month-1, day);
  let guard = 0;
  while(guard<40){
    const dow = d.getDay();
    const ds = fmt(d);
    if(dow!==0 && dow!==6 && !holidayMap[ds]) break;
    d = addDays(d,-1);
    guard++;
  }
  return fmt(d);
}

function getMonthShipping(year, month, holidayMap){
  return SHIP_BASES.map(baseDay=>{
    const key = year+'-'+month+'-'+baseDay;
    const defaultDate = computeShippingDate(year,month,baseDay,holidayMap);
    const ov = shipOverrides[key];
    let actualDate = defaultDate, note = '', cancelled = false;
    if(ov){
      if(ov.cancelled) cancelled = true;
      if(ov.date) actualDate = ov.date;
      note = ov.note || '';
    }
    return { key, baseDay, defaultDate, actualDate, note, cancelled };
  });
}

function getMonthPayday(year, month, holidayMap){
  const key = year+'-'+month;
  const defaultDate = computeShippingDate(year,month,PAY_BASE,holidayMap);
  const ov = payOverrides[key];
  let actualDate = defaultDate, note = '', cancelled = false;
  if(ov){
    if(ov.cancelled) cancelled = true;
    if(ov.date) actualDate = ov.date;
    note = ov.note || '';
  }
  return { key, defaultDate, actualDate, note, cancelled };
}

function calcRemainingThisYear(){
  const holidayMap = getHolidayMap();
  const today = todayStr();
  const thisYear = Math.max(YEAR_MIN, Math.min(YEAR_MAX, new Date().getFullYear()));
  const end = new Date(thisYear,11,31);
  let d = parseYMD(today);
  if(d.getFullYear()!==thisYear) d = new Date(thisYear,0,1);
  let count = 0, leaveAhead = 0;
  while(d<=end){
    const ds = fmt(d);
    if(isWorkday(ds,holidayMap)){
      count++;
      leaveAhead += leaveWeight(events[ds]);
    }
    d = addDays(d,1);
  }
  return { count, leaveAhead };
}

function calcLeaveInfo(){
  if(!settings.leaveStart || !settings.leaveEnd || settings.leaveTotal===null || settings.leaveTotal===undefined) return null;
  const dates = Object.keys(events)
    .filter(ds=> leaveWeight(events[ds])>0 && ds>=settings.leaveStart && ds<=settings.leaveEnd)
    .sort();
  const used = dates.reduce((sum,ds)=> sum + leaveWeight(events[ds]), 0);
  const remaining = settings.leaveTotal - used;
  return { remaining, used, total: settings.leaveTotal, dates };
}

function fmtNum(n){
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function renderStats(){
  const rem = calcRemainingThisYear();
  document.getElementById('statRemain').textContent = rem.count;
  document.getElementById('statRemainSub').textContent = rem.leaveAhead>0 ? ('연차 '+fmtNum(rem.leaveAhead)+'일 포함') : '오늘~12/31';

  const info = calcLeaveInfo();
  document.getElementById('statLeave').textContent = info===null ? '-' : fmtNum(info.remaining);
  document.getElementById('statLeaveSub').textContent = info===null ? '설정 필요' : (fmtNum(info.used)+'개 사용');

  document.getElementById('setupNotice').style.display = info===null ? 'block' : 'none';
}

function renderMonthTitle(){
  document.getElementById('monthTitle').textContent = curYear+'년 '+curMonth+'월';
}

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const holidayMap = getHolidayMap();
  const shipping = getMonthShipping(curYear,curMonth,holidayMap);
  const shipByDate = {};
  shipping.forEach(s=>{ if(!s.cancelled){ (shipByDate[s.actualDate] = shipByDate[s.actualDate]||[]).push(s); } });
  const payday = getMonthPayday(curYear,curMonth,holidayMap);

  const firstDow = new Date(curYear,curMonth-1,1).getDay();
  const dim = daysInMonth(curYear,curMonth);
  const today = todayStr();

  for(let i=0;i<firstDow;i++){
    const e = document.createElement('div');
    e.className = 'cell empty';
    grid.appendChild(e);
  }

  for(let day=1; day<=dim; day++){
    const d = new Date(curYear,curMonth-1,day);
    const ds = fmt(d);
    const dow = d.getDay();
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(dow===0) cell.classList.add('sun');
    if(dow===6) cell.classList.add('sat');
    if(holidayMap[ds]) cell.classList.add('holiday');
    if(ds===today) cell.classList.add('today');
    const ev = events[ds];
    if(ev && ev.leaveType==='full') cell.classList.add('leave');
    if(ev && ev.leaveType==='half') cell.classList.add('leave-half');

    let html = '<div class="dnum">'+day+'</div>';
    if(holidayMap[ds]) html += '<div class="hname">'+holidayMap[ds]+'</div>';
    let tags = '';
    if(ev && ev.leaveType==='full') tags += '<span class="tag leave">연차</span>';
    if(ev && ev.leaveType==='half') tags += '<span class="tag leave">반차</span>';
    if(shipByDate[ds]) tags += '<span class="tag ship">배송</span>';
    if(!payday.cancelled && payday.actualDate===ds) tags += '<span class="tag pay">월급</span>';
    if(tags) html += '<div class="tagrow">'+tags+'</div>';
    cell.innerHTML = html;
    if(ev && ev.memo){
      const dot = document.createElement('div');
      dot.className = 'memodot';
      cell.appendChild(dot);
    }
    cell.addEventListener('click', ()=>openDay(ds));
    grid.appendChild(cell);
  }
}

function renderAll(){
  renderStats();
  renderMonthTitle();
  renderGrid();
}

function openDay(ds){
  openDate = ds;
  const d = parseYMD(ds);
  const wd = ['일','월','화','수','목','금','토'][d.getDay()];
  document.getElementById('dayTitle').textContent = (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+wd+')';

  const holidayMap = getHolidayMap();
  const hnote = document.getElementById('dayHolidayNote');
  if(holidayMap[ds]){
    hnote.style.display = 'block';
    hnote.textContent = '공휴일: '+holidayMap[ds];
  } else {
    hnote.style.display = 'none';
  }

  const ev = events[ds] || { leaveType:'', memo:'' };
  document.querySelectorAll('#leaveSeg .segbtn').forEach(b=>{
    b.classList.toggle('active', (b.dataset.val||'')===(ev.leaveType||''));
  });
  document.getElementById('memoInput').value = ev.memo || '';
  updateLeaveIcsBtn(ev.leaveType||'');

  const dcurYear = d.getFullYear(), dcurMonth = d.getMonth()+1;
  const shipping = getMonthShipping(dcurYear, dcurMonth, holidayMap);
  const matches = shipping.filter(s=>s.actualDate===ds && !s.cancelled);
  const shipArea = document.getElementById('shipArea');
  shipArea.innerHTML = '';
  matches.forEach(s=>{
    const card = document.createElement('div');
    card.className = 'shipcard';
    const movedNote = s.defaultDate!==s.actualDate ? ('원래 '+s.defaultDate.slice(5).replace('-','/')+'일 것을 이 날로 이동')  : '기준일 그대로 발송';
    card.innerHTML =
      '<div class="shead"><span class="sbadge">정기배송 · 기준 '+s.baseDay+'일</span></div>'+
      '<div class="snote" style="margin-bottom:10px;">'+movedNote+'</div>'+
      '<div class="field" style="margin-bottom:8px;"><label>발송일 변경</label><input type="date" class="shipDateInput" value="'+s.actualDate+'"></div>'+
      '<div class="field" style="margin-bottom:8px;"><label>메모</label><input type="text" class="shipNoteInput" value="'+(s.note||'').replace(/"/g,'&quot;')+'" placeholder="예: 이번 회차는 수량 확인 필요"></div>'+
      '<button class="btn ghost shipIcsBtn" style="width:100%;margin-bottom:8px;">🗓 이 배송 캘린더에 추가</button>'+
      '<button class="btn danger shipCancelBtn" style="width:100%;">이 회차 발송 취소</button>';
    card.dataset.key = s.key;
    shipArea.appendChild(card);
  });

  const payday = getMonthPayday(dcurYear, dcurMonth, holidayMap);
  const payArea = document.getElementById('payArea');
  payArea.innerHTML = '';
  if(!payday.cancelled && payday.actualDate===ds){
    const card = document.createElement('div');
    card.className = 'paycard';
    const movedNote = payday.defaultDate!==payday.actualDate ? ('원래 '+payday.defaultDate.slice(5).replace('-','/')+'일 것을 이 날로 이동')  : '기준일 그대로 지급';
    card.innerHTML =
      '<div class="shead"><span class="sbadge">월급일 · 기준 '+PAY_BASE+'일</span></div>'+
      '<div class="snote" style="margin-bottom:10px;">'+movedNote+'</div>'+
      '<div class="field" style="margin-bottom:8px;"><label>지급일 변경</label><input type="date" id="payDateInput" value="'+payday.actualDate+'"></div>'+
      '<div class="field" style="margin-bottom:8px;"><label>메모</label><input type="text" id="payNoteInput" value="'+(payday.note||'').replace(/"/g,'&quot;')+'" placeholder="예: 세전/세후 확인"></div>'+
      '<button class="btn ghost" id="payIcsBtn" style="width:100%;margin-bottom:8px;">🗓 이 월급일 캘린더에 추가</button>'+
      '<button class="btn danger" id="payCancelBtn" style="width:100%;">이 회차 지급 취소</button>';
    card.dataset.key = payday.key;
    payArea.appendChild(card);
  }

  document.getElementById('dayOverlay').classList.add('show');
}

function closeDay(){
  document.getElementById('dayOverlay').classList.remove('show');
  openDate = null;
}

async function saveDay(){
  const ds = openDate;
  if(!ds) return;
  const activeSeg = document.querySelector('#leaveSeg .segbtn.active');
  const leaveType = activeSeg ? (activeSeg.dataset.val||'') : '';
  const memo = document.getElementById('memoInput').value.trim();
  if(leaveType || memo){
    events[ds] = { leaveType, memo };
  } else {
    delete events[ds];
  }

  document.querySelectorAll('.shipcard').forEach(card=>{
    const key = card.dataset.key;
    const dateVal = card.querySelector('.shipDateInput').value;
    const noteVal = card.querySelector('.shipNoteInput').value.trim();
    const existing = shipOverrides[key] || {};
    const cancelled = existing.cancelled || false;
    shipOverrides[key] = { date: dateVal || null, note: noteVal, cancelled };
  });

  const payCard = document.querySelector('.paycard');
  if(payCard){
    const key = payCard.dataset.key;
    const dateVal = document.getElementById('payDateInput').value;
    const noteVal = document.getElementById('payNoteInput').value.trim();
    const existing = payOverrides[key] || {};
    const cancelled = existing.cancelled || false;
    payOverrides[key] = { date: dateVal || null, note: noteVal, cancelled };
  }

  await saveAllState();
  closeDay();
  renderAll();
}

document.addEventListener('click', function(e){
  if(e.target.classList.contains('shipCancelBtn')){
    const card = e.target.closest('.shipcard');
    const key = card.dataset.key;
    const existing = shipOverrides[key] || {};
    shipOverrides[key] = Object.assign({}, existing, {cancelled:true});
    card.remove();
  }
  if(e.target.id === 'payCancelBtn'){
    const card = e.target.closest('.paycard');
    const key = card.dataset.key;
    const existing = payOverrides[key] || {};
    payOverrides[key] = Object.assign({}, existing, {cancelled:true});
    card.remove();
  }
  if(e.target.classList.contains('segbtn')){
    const parent = e.target.closest('.segrow');
    parent.querySelectorAll('.segbtn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    updateLeaveIcsBtn(e.target.dataset.val||'');
  }
  if(e.target.classList.contains('shipIcsBtn')){
    const card = e.target.closest('.shipcard');
    const dateVal = card.querySelector('.shipDateInput').value;
    const noteVal = card.querySelector('.shipNoteInput').value.trim();
    const badge = card.querySelector('.sbadge').textContent;
    addSingleEventToCalendar('정기배송 ('+badge.split('·')[1].trim()+')', dateVal, noteVal);
  }
  if(e.target.id === 'payIcsBtn'){
    const dateVal = document.getElementById('payDateInput').value;
    const noteVal = document.getElementById('payNoteInput').value.trim();
    addSingleEventToCalendar('월급일', dateVal, noteVal);
  }
});

function updateLeaveIcsBtn(val){
  const btn = document.getElementById('leaveIcsBtn');
  if(!val){
    btn.disabled = true;
    btn.textContent = '🗓 이 연차 캘린더에 추가';
  } else {
    btn.disabled = false;
    btn.textContent = '🗓 이 '+(val==='half'?'반차':'연차')+' 캘린더에 추가';
  }
}
document.getElementById('leaveIcsBtn').addEventListener('click', ()=>{
  if(!openDate) return;
  const activeSeg = document.querySelector('#leaveSeg .segbtn.active');
  const val = activeSeg ? (activeSeg.dataset.val||'') : '';
  if(!val) return;
  const memo = document.getElementById('memoInput').value.trim();
  addSingleEventToCalendar(val==='half'?'반차':'연차', openDate, memo);
});

function addSingleEventToCalendar(title, ds, desc){
  if(hasClaudeStorage){
    // Claude 아티팩트 미리보기에는 이 서버 함수가 없으니, 있는 그대로 새 탭에 열어 확인용으로만 보여줘요.
    const ics = singleEventICS(title, ds, desc);
    window.open('data:text/calendar;charset=utf-8,' + encodeURIComponent(ics), '_blank');
    return;
  }
  const params = new URLSearchParams({ title: title, date: ds.replace(/-/g,''), desc: desc||'' });
  window.location.href = '/.netlify/functions/ics?' + params.toString();
}

document.getElementById('dayClose').addEventListener('click', closeDay);
document.getElementById('dayCancel').addEventListener('click', closeDay);
document.getElementById('daySave').addEventListener('click', saveDay);

document.getElementById('prevBtn').addEventListener('click', ()=>{
  curMonth--; if(curMonth<1){curMonth=12;curYear--;}
  if(curYear<YEAR_MIN){curYear=YEAR_MIN;curMonth=1;}
  renderAll();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  curMonth++; if(curMonth>12){curMonth=1;curYear++;}
  if(curYear>YEAR_MAX){curYear=YEAR_MAX;curMonth=12;}
  renderAll();
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  const d = new Date();
  const y = Math.max(YEAR_MIN, Math.min(YEAR_MAX, d.getFullYear()));
  curYear = y;
  curMonth = (d.getFullYear()===y) ? d.getMonth()+1 : 1;
  renderAll();
});

/* ---------- Month picker ---------- */
let pickerYear = curYear;
function renderMonthPicker(){
  const yearTabs = document.getElementById('yearTabs');
  yearTabs.innerHTML = '';
  for(let y=YEAR_MIN; y<=YEAR_MAX; y++){
    const b = document.createElement('button');
    b.className = 'yeartab' + (y===pickerYear ? ' active' : '');
    b.textContent = y+'년';
    b.addEventListener('click', ()=>{ pickerYear = y; renderMonthPicker(); });
    yearTabs.appendChild(b);
  }
  const monthGrid = document.getElementById('monthGrid');
  monthGrid.innerHTML = '';
  const today = new Date();
  for(let m=1; m<=12; m++){
    const b = document.createElement('button');
    b.className = 'monthbtn';
    if(pickerYear===curYear && m===curMonth) b.classList.add('active');
    if(pickerYear===today.getFullYear() && m===today.getMonth()+1) b.classList.add('istoday');
    b.textContent = m+'월';
    b.addEventListener('click', ()=>{
      curYear = pickerYear; curMonth = m;
      closeMonthPicker();
      renderAll();
    });
    monthGrid.appendChild(b);
  }
}
function openMonthPicker(){
  pickerYear = curYear;
  renderMonthPicker();
  document.getElementById('monthPickerOverlay').classList.add('show');
}
function closeMonthPicker(){
  document.getElementById('monthPickerOverlay').classList.remove('show');
}
document.getElementById('monthTitleBtn').addEventListener('click', openMonthPicker);
document.getElementById('monthPickerClose').addEventListener('click', closeMonthPicker);

/* ---------- Leave history ---------- */
function openLeaveHistory(){
  const info = calcLeaveInfo();
  const body = document.getElementById('leaveHistoryBody');
  if(info===null){
    body.innerHTML = '<div class="lh-empty">설정에서 연차 사용 기간과 총 개수를 먼저 입력해주세요.</div>';
  } else {
    let html = '<div class="lh-summary">'+
      '<div class="lh-box"><div class="lv">'+fmtNum(info.total)+'</div><div class="ll">총 개수</div></div>'+
      '<div class="lh-box"><div class="lv">'+fmtNum(info.used)+'</div><div class="ll">사용</div></div>'+
      '<div class="lh-box"><div class="lv">'+fmtNum(info.remaining)+'</div><div class="ll">남음</div></div>'+
      '</div>';
    html += '<div class="smalltext" style="margin-bottom:14px;">'+settings.leaveStart+' ~ '+settings.leaveEnd+' 기준</div>';
    if(info.dates.length===0){
      html += '<div class="lh-empty">아직 사용한 연차가 없어요.</div>';
    } else {
      html += '<div class="lh-list">';
      info.dates.forEach(ds=>{
        const d = parseYMD(ds);
        const wd = ['일','월','화','수','목','금','토'][d.getDay()];
        const memo = (events[ds] && events[ds].memo) ? events[ds].memo : '';
        const typeLabel = (events[ds] && events[ds].leaveType==='half') ? '반차' : '연차';
        html += '<div class="lh-row"><div><div class="lhd">'+d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+wd+') · '+typeLabel+'</div>'+
          (memo?('<div class="lhm">'+memo+'</div>'):'')+
          '</div></div>';
      });
      html += '</div>';
    }
    body.innerHTML = html;
  }
  document.getElementById('leaveHistoryOverlay').classList.add('show');
}
function closeLeaveHistory(){
  document.getElementById('leaveHistoryOverlay').classList.remove('show');
}
document.getElementById('leaveStatItem').addEventListener('click', openLeaveHistory);
document.getElementById('leaveHistoryClose').addEventListener('click', closeLeaveHistory);
document.getElementById('leaveHistoryToSettings').addEventListener('click', ()=>{
  closeLeaveHistory();
  openSettings();
});

/* ---------- Settings ---------- */
function renderHolidayList(){
  const list = document.getElementById('holidayList');
  list.innerHTML = '';
  ALL_HOLIDAYS.forEach(([d,n])=>{
    const row = document.createElement('div');
    row.className = 'hrow';
    const checked = !settings.removedHolidays.includes(d);
    row.innerHTML = '<input type="checkbox" class="chk hchk" data-date="'+d+'" '+(checked?'checked':'')+'>'+
      '<span class="hd">'+d.slice(2).replace(/-/g,'/')+'</span><span class="hn">'+n+'</span>';
    list.appendChild(row);
  });
}
function renderCustomHolidayList(){
  const list = document.getElementById('customHList');
  list.innerHTML = '';
  (settings.extraHolidays||[]).forEach((h,idx)=>{
    const row = document.createElement('div');
    row.className = 'hrow';
    row.innerHTML = '<span class="hd">'+h.date+'</span><span class="hn">'+h.name+'</span>'+
      '<button class="xbtn" data-idx="'+idx+'">✕</button>';
    list.appendChild(row);
  });
}

document.getElementById('addCustomH').addEventListener('click', ()=>{
  const dEl = document.getElementById('customHDate');
  const nEl = document.getElementById('customHName');
  if(!dEl.value) return;
  settings.extraHolidays = settings.extraHolidays || [];
  settings.extraHolidays.push({date:dEl.value, name:nEl.value.trim() || '휴무일'});
  dEl.value=''; nEl.value='';
  renderCustomHolidayList();
});
document.getElementById('customHList').addEventListener('click', (e)=>{
  if(e.target.classList.contains('xbtn')){
    const idx = Number(e.target.dataset.idx);
    settings.extraHolidays.splice(idx,1);
    renderCustomHolidayList();
  }
});

function openSettings(){
  document.getElementById('leaveStartInput').value = settings.leaveStart || '';
  document.getElementById('leaveEndInput').value = settings.leaveEnd || '';
  document.getElementById('leaveTotalInput').value = settings.leaveTotal===null||settings.leaveTotal===undefined ? '' : settings.leaveTotal;
  if(!hasClaudeStorage){
    document.getElementById('syncCodeInput').value = syncConfig.syncKey || '';
  }
  renderHolidayList();
  renderCustomHolidayList();
  document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings(){
  document.getElementById('settingsOverlay').classList.remove('show');
}
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('settingsClose').addEventListener('click', closeSettings);

document.getElementById('settingsSave').addEventListener('click', async ()=>{
  settings.leaveStart = document.getElementById('leaveStartInput').value || '';
  settings.leaveEnd = document.getElementById('leaveEndInput').value || '';
  const lv = document.getElementById('leaveTotalInput').value;
  settings.leaveTotal = lv==='' ? null : Number(lv);
  settings.removedHolidays = [];
  document.querySelectorAll('.hchk').forEach(chk=>{
    if(!chk.checked) settings.removedHolidays.push(chk.dataset.date);
  });
  await saveAllState();
  closeSettings();
  renderAll();
});

/* ---------- Storage backends ---------- */
const hasClaudeStorage = (typeof window.storage !== 'undefined');
function loadSyncConfig(){
  try{ return JSON.parse(localStorage.getItem('workcal_syncconfig')||'{}'); }
  catch(err){ return {}; }
}
let syncConfig = loadSyncConfig();

function setSyncStatusText(t){
  const el = document.getElementById('syncStatusText');
  if(el) el.textContent = t;
}

function migrateEvents(evObj){
  const out = {};
  Object.keys(evObj||{}).forEach(ds=>{
    const e = evObj[ds];
    if(e && e.leaveType===undefined && e.leave!==undefined){
      out[ds] = { leaveType: e.leave ? 'full' : '', memo: e.memo || '' };
    } else {
      out[ds] = e;
    }
  });
  return out;
}

function applyLoadedBlob(blob){
  if(blob.settings){
    const loaded = blob.settings;
    if(loaded.baseDate && !loaded.leaveStart){
      loaded.leaveStart = loaded.baseDate;
      loaded.leaveTotal = (loaded.leaveTotal===undefined||loaded.leaveTotal===null) ? loaded.baseLeaveCount : loaded.leaveTotal;
    }
    settings = Object.assign(settings, loaded);
  }
  events = migrateEvents(blob.events || {});
  shipOverrides = blob.shipOverrides || {};
  payOverrides = blob.payOverrides || {};
}

async function persistSettings(){
  try{ await window.storage.set('settings', JSON.stringify(settings), false); }
  catch(err){ console.error('설정 저장 실패', err); }
}
async function persistEvents(){
  try{ await window.storage.set('events', JSON.stringify(events), false); }
  catch(err){ console.error('이벤트 저장 실패', err); }
}
async function persistShipping(){
  try{ await window.storage.set('shipOverrides', JSON.stringify(shipOverrides), false); }
  catch(err){ console.error('배송 정보 저장 실패', err); }
}
async function persistPay(){
  try{ await window.storage.set('payOverrides', JSON.stringify(payOverrides), false); }
  catch(err){ console.error('월급 정보 저장 실패', err); }
}

async function loadFromClaude(){
  try{
    const r = await window.storage.get('settings', false);
    if(r && r.value) applyLoadedBlob({ settings: JSON.parse(r.value) });
  }catch(err){ /* no settings yet */ }
  try{
    const r = await window.storage.get('events', false);
    if(r && r.value) events = migrateEvents(JSON.parse(r.value));
  }catch(err){ /* no events yet */ }
  try{
    const r = await window.storage.get('shipOverrides', false);
    if(r && r.value) shipOverrides = JSON.parse(r.value);
  }catch(err){ /* none yet */ }
  try{
    const r = await window.storage.get('payOverrides', false);
    if(r && r.value) payOverrides = JSON.parse(r.value);
  }catch(err){ /* none yet */ }
}

/* Netlify Functions + Netlify Blobs 기반 동기화 (Supabase 없이) */
async function fetchRemote(){
  const res = await fetch('/.netlify/functions/sync?key='+encodeURIComponent(syncConfig.syncKey));
  if(!res.ok) throw new Error('fetch failed: '+res.status);
  const json = await res.json();
  return json.data;
}
async function pushRemote(blob){
  const res = await fetch('/.netlify/functions/sync?key='+encodeURIComponent(syncConfig.syncKey), {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(blob)
  });
  if(!res.ok) throw new Error('push failed: '+res.status);
}

async function saveAllState(){
  if(hasClaudeStorage){
    await persistSettings();
    await persistEvents();
    await persistShipping();
    await persistPay();
    return;
  }
  const blob = { settings, events, shipOverrides, payOverrides };
  localStorage.setItem('workcal_local', JSON.stringify(blob));
  if(syncConfig.syncKey){
    try{
      await pushRemote(blob);
      setSyncStatusText('마지막 동기화: '+new Date().toLocaleTimeString());
    }catch(err){
      console.error('동기화 저장 실패', err);
      setSyncStatusText('동기화 실패 (이 기기에는 저장됨)');
    }
  }
}

async function loadAllState(){
  if(hasClaudeStorage){
    await loadFromClaude();
    return;
  }
  try{
    const raw = localStorage.getItem('workcal_local');
    if(raw) applyLoadedBlob(JSON.parse(raw));
  }catch(err){ /* none yet */ }
  if(syncConfig.syncKey){
    try{
      const data = await fetchRemote();
      if(data){
        applyLoadedBlob(data);
        setSyncStatusText('동기화됨');
      } else {
        setSyncStatusText('이 코드로 저장된 데이터가 아직 없어요 (새로 시작)');
      }
    }catch(err){
      console.error('동기화 불러오기 실패', err);
      setSyncStatusText('동기화 실패 - 이 기기의 데이터를 표시해요');
    }
  }
}

document.getElementById('syncConnectBtn').addEventListener('click', async ()=>{
  const code = document.getElementById('syncCodeInput').value.trim();
  if(!code){
    setSyncStatusText('동기화 코드를 입력해주세요.');
    return;
  }
  syncConfig = { syncKey: code };
  localStorage.setItem('workcal_syncconfig', JSON.stringify(syncConfig));
  setSyncStatusText('연결하는 중…');
  try{
    const data = await fetchRemote();
    if(data){
      applyLoadedBlob(data);
      setSyncStatusText('기존 데이터를 불러왔어요. 동기화됨.');
    } else {
      setSyncStatusText('새 동기화 코드예요. 저장하면 이 코드로 백업돼요.');
    }
    renderAll();
    renderHolidayList();
    renderCustomHolidayList();
    document.getElementById('leaveStartInput').value = settings.leaveStart || '';
    document.getElementById('leaveEndInput').value = settings.leaveEnd || '';
    document.getElementById('leaveTotalInput').value = settings.leaveTotal===null||settings.leaveTotal===undefined ? '' : settings.leaveTotal;
    await saveAllState();
  }catch(err){
    console.error(err);
    setSyncStatusText('연결 실패 - 배포가 완료됐는지, 함수가 켜져 있는지 확인해주세요.');
  }
});

/* ---------- Apple 캘린더용 .ics 내보내기 ---------- */
function icsDate(ds){ return ds.replace(/-/g,''); }
function icsDateNext(ds){
  const d = parseYMD(ds);
  d.setDate(d.getDate()+1);
  return fmt(d).replace(/-/g,'');
}
function icsEscape(text){
  return String(text||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function singleEventICS(title, ds, desc){
  const now = new Date();
  const stamp = fmt(now).replace(/-/g,'')+'T'+String(now.getHours()).padStart(2,'0')+String(now.getMinutes()).padStart(2,'0')+String(now.getSeconds()).padStart(2,'0');
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//work-calendar//KR','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:'+Date.now()+'-'+Math.random().toString(36).slice(2)+'@work-calendar.app',
    'DTSTAMP:'+stamp,
    'DTSTART;VALUE=DATE:'+icsDate(ds),
    'DTEND;VALUE=DATE:'+icsDateNext(ds),
    'SUMMARY:'+icsEscape(title)
  ];
  if(desc) lines.push('DESCRIPTION:'+icsEscape(desc));
  lines.push('END:VEVENT','END:VCALENDAR');
  return lines.join('\r\n');
}

(async function init(){
  const d = new Date();
  const y = Math.max(YEAR_MIN, Math.min(YEAR_MAX, d.getFullYear()));
  curYear = y;
  curMonth = (d.getFullYear()===y) ? d.getMonth()+1 : 1;
  if(!hasClaudeStorage){
    document.getElementById('syncSection').style.display = 'block';
    if(syncConfig.url && syncConfig.anonKey && syncConfig.syncKey){
      setSyncStatusText('연결 확인 중…');
    }
  }
  await loadAllState();
  renderAll();
  if(!settings.leaveStart || !settings.leaveEnd || settings.leaveTotal===null || settings.leaveTotal===undefined){
    openSettings();
  }
})();
